name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    # Markdown-only pull requests skip the jobs below: no test, build or type check can
    # fail on a .md file except formatting and links, which docs.yml checks on every pull
    # request. Pushes to main run everything. A rename counts its old name too.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2 # the pull request's merge commit and its base parent
          persist-credentials: false
      - id: diff
        shell: bash # with pipefail: a failed git diff fails this job, and ci-ok with it
        env:
          EVENT: ${{ github.event_name }}
        run: |
          code=true
          if [[ "$EVENT" == pull_request ]]; then
            files="$(git diff --no-renames --name-only HEAD^1 HEAD)"
            if [[ -n "$files" ]] && ! grep -qv '\.md$' <<< "$files"; then
              code=false
            fi
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  checks:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy data-pipeline/data-preparation/src data-mining-framework/src strategy-evaluation/src scripts
      - run: uv run pytest --cov=invest_data --cov=invest_mining --cov=invest_evaluation --cov-branch --cov-report=term-missing
      - run: uv run coverage json -q -o coverage.json
      - run: uv run python scripts/check_coverage_floors.py coverage.json
      - run: uv run python scripts/check_markdown_links.py

  tests-windows:
    # Every change must work on Linux and Windows (PYTHON_GUIDELINES.md). Formatting, lint,
    # coverage floors and link checks do not depend on the platform and stay in `checks`;
    # strict mypy runs here too because it type-checks the Windows side of platform checks.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 45 # about 8.5 minutes normally; a hung script test stops here
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    defaults:
      run:
        shell: bash # Git Bash, which the workflow-script tests also run
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen
      - run: uv run mypy data-pipeline/data-preparation/src data-mining-framework/src strategy-evaluation/src scripts
      - run: uv run pytest

  wheels:
    # Build all three wheels and test them as installed, not from the source tree.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.11"
      - run: uv build --all-packages --out-dir "$RUNNER_TEMP/dist"
      - name: Install the built wheels into a clean venv
        run: |
          uv venv "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv" "$RUNNER_TEMP"/dist/*.whl pytest
      - name: CLI smoke test
        run: |
          for cli in invest-data invest-mine invest-eval; do "$RUNNER_TEMP/venv/bin/$cli" --help > /dev/null; done
      - name: Component and end-to-end tests against the installed wheels
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/venv/bin/python" -m pytest -p no:cacheprovider --rootdir "$GITHUB_WORKSPACE" \
            "$GITHUB_WORKSPACE/data-pipeline/data-preparation/tests" \
            "$GITHUB_WORKSPACE/data-mining-framework/tests" \
            "$GITHUB_WORKSPACE/strategy-evaluation/tests" \
            "$GITHUB_WORKSPACE/tests/test_pipeline.py"

  independent-install:
    # Each component must install and pass its own tests without the others' dev setup.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - data-pipeline/data-preparation
          - data-mining-framework
          - strategy-evaluation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.11"
      - name: Install component alone (plus the data contract package it depends on)
        run: |
          uv venv /tmp/venv
          uv pip install --python /tmp/venv ./data-pipeline/data-preparation ./${{ matrix.component }} pytest
      - name: Mining must not be importable from evaluation
        if: matrix.component == 'strategy-evaluation'
        run: /tmp/venv/bin/python -c "import importlib.util, sys; sys.exit(importlib.util.find_spec('invest_mining') is not None)"
      - run: /tmp/venv/bin/python -m pytest -p no:cacheprovider ${{ matrix.component }}/tests

  ci-ok:
    # The one check of this workflow to require in branch protection: it passes when every
    # job above passed, or when all of them were skipped for a Markdown-only pull request.
    needs: [changes, checks, tests-windows, wheels, independent-install]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          RESULTS: >-
            ${{ needs.checks.result }} ${{ needs.tests-windows.result }}
            ${{ needs.wheels.result }} ${{ needs.independent-install.result }}
        run: |
          echo "changes: $CHANGES (code: $CODE); jobs: $RESULTS"
          [[ "$CHANGES" == success ]] || exit 1
          want=success
          [[ "$CODE" == false ]] && want=skipped
          for result in $RESULTS; do
            [[ "$result" == "$want" ]] || exit 1
          done
