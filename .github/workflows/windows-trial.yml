# TEMPORARY trial for the "Add Windows to the standard CI tests" thread: runs the
# proposed `tests-windows` job's steps on every push to this branch. Not meant for main.
name: Windows trial (temporary)

on:
  push:
    branches: [claude/project-thread-slquh6]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests-windows-trial:
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen
      - run: uv run mypy data-pipeline/data-preparation/src data-mining-framework/src strategy-evaluation/src scripts
      - run: uv run pytest -rfE --durations=10
